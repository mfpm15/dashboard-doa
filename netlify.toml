[build]
  command = "node scripts/build.mjs"
  publish = "public/teduh"

[build.environment]
  NODE_VERSION = "22"

# Preserve bookmarks created with the old /teduh/ path.
[[redirects]]
  from = "/teduh"
  to = "/index.html"
  status = 301

[[redirects]]
  from = "/teduh/*"
  to = "/:splat"
  status = 200

# Previous Next.js-only routes lead to the same complete Doa Teduh app.
[[redirects]]
  from = "/koleksi"
  to = "/index.html"
  status = 302

[[redirects]]
  from = "/setelah-salat"
  to = "/index.html"
  status = 302

[[redirects]]
  from = "/legacy"
  to = "/index.html"
  status = 302

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"

[[headers]]
  for = "/data.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/extras.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/deploy-meta.json"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"
