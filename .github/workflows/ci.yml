name: Static Doa Teduh checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Build and verify static prayer library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build without npm dependencies
        run: node scripts/build.mjs
      - name: Verify generated content and JavaScript
        run: node scripts/verify-static.mjs
      - name: Report artifact size
        run: |
          du -sh public/teduh
          find public/teduh -maxdepth 1 -type f -printf '%f: %s bytes\n' | sort
