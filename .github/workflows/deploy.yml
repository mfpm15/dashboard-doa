name: Verify Netlify Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Build & verify production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run build
      - name: Trigger Netlify build if explicit hook configured
        env:
          NETLIFY_BUILD_HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
        run: |
          if [ -n "$NETLIFY_BUILD_HOOK_URL" ]; then
            curl --fail --silent --show-error --request POST "$NETLIFY_BUILD_HOOK_URL" > /dev/null
            echo "Netlify build hook requested."
          else
            echo "Netlify Git integration should deploy pushes to main directly."
            echo "If production is stale, check Netlify production branch, paused builds, and auto-publishing."
          fi
