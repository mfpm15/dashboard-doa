name: Deploy and Verify Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Verify live production commit and v3.4 frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and validate static content
        run: node scripts/build.mjs

      - name: Trigger Netlify build if backup trigger configured
        env:
          NETLIFY_BUILD_HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -n "${NETLIFY_BUILD_HOOK_URL:-}" ]; then
            curl --fail --silent --show-error --request POST -d '{}' "$NETLIFY_BUILD_HOOK_URL" > /dev/null
            echo "Requested Netlify build through configured hook."
          else
            echo "Using active Netlify Git auto-deploy integration with main."
          fi

      - name: Confirm latest commit is live
        env:
          EXPECTED_SHA: ${{ github.sha }}
          SITE_URL: https://doa-solat.netlify.app
        run: |
          set -euo pipefail
          for attempt in $(seq 1 25); do
            response="$(curl --fail --location --silent --show-error --max-time 10 -H 'Cache-Control: no-cache' "$SITE_URL/deploy-meta.json?sha=$EXPECTED_SHA&attempt=$attempt" || true)"
            if [ -n "$response" ] && printf '%s' "$response" | grep -Fq "\"commit\": \"$EXPECTED_SHA\""; then
              echo "SUCCESS: Netlify production serves commit $EXPECTED_SHA"
              break
            fi
            if [ "$attempt" = 25 ]; then
              echo "::error::Netlify production remains stale. Check production branch, build status and deploy locks."
              exit 1
            fi
            sleep 12
          done

      - name: Check original v3.4 app and old bookmarks
        run: |
          set -euo pipefail
          base="https://doa-solat.netlify.app"
          work="$(mktemp -d)"
          curl -fLsS --max-time 25 "$base/?v=${GITHUB_SHA}" -o "$work/index.html"
          grep -Fq 'Doa Teduh v3.4' "$work/index.html"
          curl -fLsS --max-time 25 "$base/teduh/index.html?v=${GITHUB_SHA}" -o "$work/legacy.html"
          grep -Fq 'Doa Teduh v3.4' "$work/legacy.html"
          for asset in app.js style.css data.js extras.js sw.js import.html; do
            curl -fLsS --max-time 25 "$base/$asset?v=${GITHUB_SHA}" -o "$work/$asset"
          done
          grep -Fq 'window.startDoaTeduh' "$work/app.js"
          grep -Fq 'window.DOA_DATA=' "$work/data.js"
          grep -Fq '.nav-dock' "$work/style.css"
          grep -Fq 'Impor Pribadi' "$work/import.html"
          echo "SUCCESS: static Doa Teduh UI and original /teduh/ links live."
